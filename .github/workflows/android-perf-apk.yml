name: Android perf APK

# Builds an installable arm64 APK from this fork with an engine built here from
# source, so a newer engine branch (qemu-ios dev/perf) can be tested on a phone
# without a development machine.
#
# What is rebuilt: the Kotlin/Compose app, the JNI/native frontend
# (liblighttouch_jni.so) and the engine (libqemu-arm.so) from the requested
# engine ref.
#
# What is reused: the pieces that are not part of what is being tested and that
# cannot be built off a Mac — firmwarekit (device preparation), its one-shot
# booter, the USB bridge and the guest tools. They are extracted from a
# published release APK (base_release_repository/base_release_tag) so the APK
# stays usable on a phone.
#
# The APK is signed with a keystore generated on the first run and reused after
# that, so successive runs of this workflow update each other in place. It is
# NOT signed with the key of the published releases, so installing it over a
# published APK needs an uninstall first (which erases the app's prepared
# devices; the APK carries firmwarekit, so they can be prepared again).
#
# PGO: a run with engine_cflags=-fprofile-generate produces an instrumented
# engine whose profile the phone writes at LT_PGO_DUMP seconds (LT_PGO_FILE
# names the output path); upload that .profraw to a release of this repository
# and run again with pgo_profile="<release-tag>/<asset-name>" for a
# -fprofile-use build of the same engine revision.
#
# Inputs and caches are pinned by content, not by date: the dependency and
# engine caches are restored only on an exact key match, because the engine
# build refuses a cached tree whose recipe changed. If a run fails in the engine
# step with a cache-refusal message, delete the `lt-engine-*` cache and re-run.

on:
  workflow_dispatch:
    inputs:
      engine_repository:
        description: Engine source repository
        required: true
        default: KlugKlugTG/qemu-ios
      engine_ref:
        description: Engine branch, tag or commit to build
        required: true
        default: perf
      engine_cflags:
        description: Extra engine compiler flags (a PGO pass builds here, e.g. -fprofile-generate)
        required: false
        default: ""
      engine_configure_args:
        description: Extra configure options for the engine build (e.g. "-Db_lto=true"); empty for the default
        required: false
        default: ""
      pgo_profile:
        description: PGO profile to build against, as "release-tag/asset-name" of a .profraw or .profdata
        required: false
        default: ""
      base_release_repository:
        description: Release whose APK supplies firmwarekit, USB bridge and guest tools
        required: true
        default: blake-lucas/LightTouch
      base_release_tag:
        description: Release tag for those inputs
        required: true
        default: v0.0.9
      jobs:
        description: Parallel compile jobs (the engine scripts ask for -j2 explicitly)
        required: true
        default: "4"
      debuggable:
        description: Debuggable APK - needed for files/debug-env engine switches and adb run-as
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      dependency_verification:
        description: Gradle dependency verification against Android/gradle/verification-metadata.xml
        type: choice
        options:
          - strict
          - lenient
          - off
        default: strict
      create_release:
        description: Attach the APK to a pre-release of this repository
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: write

concurrency:
  group: android-perf-apk
  cancel-in-progress: false

jobs:
  perf-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 28.2.13676358
      LT_JOBS: ${{ inputs.jobs }}
      ENGINE_REPO: ${{ inputs.engine_repository }}
      ENGINE_REF: ${{ inputs.engine_ref }}
      MESON: ${{ github.workspace }}/meson/bin/meson
      LT_ENGINE_CFLAGS: ${{ inputs.engine_cflags }}
      LT_ENGINE_CONFIGURE_ARGS: ${{ inputs.engine_configure_args }}
      PGO_PROFILE: ${{ inputs.pgo_profile }}

    steps:
      - name: Check out this fork
        uses: actions/checkout@v4

      - name: Check out the engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: qemu-ios
          fetch-depth: 1

      - name: Record the engine revision
        id: engine
        run: |
          echo "sha=$(git -C qemu-ios rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Names the APK after what the engine was built with, so several experiments
          # can sit in the same release without being mistaken for each other.
          case "$LT_ENGINE_CFLAGS $LT_ENGINE_CONFIGURE_ARGS" in
            *profile-generate*) tag="-pgo-collect" ;;
            *profile*) tag="-pgo" ;;
            *b_lto*|*flto*) tag="-lto" ;;
            "") tag="" ;;
            *) tag="-tuned" ;;
          esac
          echo "MODE_TAG=$tag" >> "$GITHUB_ENV"
          echo "APK is named ci/LightTouch-<engine>${tag}-arm64-debug.apk"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space
        run: |
          df -h / | tail -1
          # The engine build trees, the NDK and Gradle are the three big ones; the
          # image ships several preinstalled NDKs and system images we do not use.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc \
            /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/sources \
            /usr/local/share/chromium /usr/lib/firefox /var/lib/docker/overlay2/* || true
          df -h / /mnt 2>/dev/null | tail -3
      - name: Install host tools, NDK 28.2 and CMake 3.22.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config python3-venv perl autoconf automake libtool
          python3 -m venv meson
          meson/bin/pip install --quiet --disable-pip-version-check meson==1.10.0 packaging==24.0
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          ninja --version
          meson/bin/meson --version

      # The engine scripts ask ninja and make for exactly two jobs. The wrapper
      # rewrites that one argument; nothing else about their recipes changes.
      - name: Let the engine scripts use more than two jobs
        run: |
          mkdir -p ci/bin
          printf '%s\n' '#!/bin/bash' \
            'args=(); for a in "$@"; do case "$a" in -j2) args+=("-j${LT_JOBS:-2}");; *) args+=("$a");; esac; done' \
            'exec "@REAL@" "${args[@]}"' > ci/bin/tool-template
          sed -e "s|@REAL@|$(command -v ninja)|" ci/bin/tool-template > ci/bin/ninja
          sed -e "s|@REAL@|$(command -v make)|" ci/bin/tool-template > ci/bin/make
          rm ci/bin/tool-template
          chmod +x ci/bin/ninja ci/bin/make
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          cat ci/bin/ninja

      - name: Cache the engine dependencies
        uses: actions/cache@v4
        with:
          path: |
            ci/deps
            ci/crypto
          key: lt-deps-arm64-${{ hashFiles('qemu-ios/contrib/portable/dependencies.json', 'qemu-ios/contrib/portable/crypto-dependencies.json') }}

      - name: Cache the engine object tree
        uses: actions/cache@v4
        with:
          path: ci/engine-build
          key: lt-engine-${{ steps.engine.outputs.sha }}-j${{ inputs.jobs }}-${{ inputs.engine_cflags == '' && 'plain' || 'flagged' }}-${{ hashFiles('qemu-ios/contrib/portable/dependencies.json', 'qemu-ios/contrib/portable/crypto-dependencies.json') }}

      - name: Cache the signing key
        uses: actions/cache@v4
        with:
          path: ci/debug.keystore
          key: lt-ci-debug-keystore-v1

      - name: Use a stable keystore for the debug build
        run: |
          mkdir -p "$HOME/.android" ci
          if [ ! -f ci/debug.keystore ]; then
            keytool -genkeypair -keystore ci/debug.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp ci/debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -keystore ci/debug.keystore -storepass android | tail -3
          SIGNER="$(keytool -list -v -keystore ci/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z')"
          [ -n "$SIGNER" ] || { echo '::error::the keystore has no androiddebugkey'; exit 1; }
          echo "LT_SIGNER_SHA256=$SIGNER" >> "$GITHUB_ENV"
          echo "keystore signer: $SIGNER"

      # Configures the whole Gradle build (plugins, dependency verification, the
      # Compose compiler) before the two-hour engine build, so a resolution
      # problem fails here instead of at the end.
      - name: Preflight the Gradle build
        working-directory: Android
        run: |
          # Resolving the runtime classpath checks the pinned dependency
          # verification; the dry run configures every task without running it.
          ./gradlew --no-daemon --max-workers="$LT_JOBS" \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' \
            --dependency-verification=${{ inputs.dependency_verification }} \
            :app:dependencies --configuration debugRuntimeClasspath > /dev/null
          ./gradlew --no-daemon --max-workers="$LT_JOBS" \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' \
            --dependency-verification=${{ inputs.dependency_verification }} \
            --dry-run :app:assembleDebug

      - name: Fetch and merge a PGO profile
        if: inputs.pgo_profile != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/pgo
          TAG="${PGO_PROFILE%%/*}"; ASSET="${PGO_PROFILE#*/}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir ci/pgo --clobber
          RAW="$(ls ci/pgo/*.profraw ci/pgo/*.profdata 2>/dev/null | head -1)"
          test -n "$RAW" || { echo "::error::no .profraw or .profdata came out of $PGO_PROFILE"; exit 1; }
          LLVM_PROFDATA="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-profdata"
          case "$RAW" in
            *.profraw) "$LLVM_PROFDATA" merge -o ci/pgo/merged.profdata "$RAW" ;;
            *) cp "$RAW" ci/pgo/merged.profdata ;;
          esac
          sha256sum ci/pgo/merged.profdata | tee ci/pgo/merged.sha256

      - name: Build the engine dependencies
        run: |
          python3 qemu-ios/contrib/portable/build-deps.py ci/deps \
            --abi arm64-v8a --ndk "$ANDROID_NDK_ROOT" --meson "$MESON"
          python3 qemu-ios/contrib/portable/build-crypto-deps.py ci/crypto \
            --abi arm64-v8a --ndk "$ANDROID_NDK_ROOT"

      - name: Build the engine
        run: |
          FLAGS="$LT_ENGINE_CFLAGS"
          if [ -n "$PGO_PROFILE" ]; then
            FLAGS="$FLAGS -fprofile-use=$GITHUB_WORKSPACE/ci/pgo/merged.profdata -fprofile-correction -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          fi
          export LT_ENGINE_CFLAGS="$FLAGS"
          echo "engine compiler flags: '$LT_ENGINE_CFLAGS'"
          engine() {
            python3 qemu-ios/contrib/portable/build-engine.py ci/engine-build \
              --abi arm64-v8a --ndk "$ANDROID_NDK_ROOT" --android-api 29 \
              --prefix ci/deps/prefix --crypto-prefix ci/crypto/prefix
          }
          # A restored object tree whose recipe no longer matches is refused
          # rather than silently reused; retry once from an empty tree.
          engine || { rm -rf ci/engine-build; engine; }

      - name: Stage the engine next to the NDK C++ runtime
        run: |
          mkdir -p ci/engine/arm64-v8a
          cp ci/engine-build/libqemu-arm.so ci/engine/arm64-v8a/
          cp ci/engine-build/libc++_shared.so ci/engine/arm64-v8a/
          cp ci/engine-build/portable-manifest.json ci/engine/arm64-v8a/ 2>/dev/null || true
          ls -la ci/engine/arm64-v8a
          file ci/engine/arm64-v8a/libqemu-arm.so

      - name: Extract firmwarekit, USB bridge and guest tools from the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/base
          gh release download "${{ inputs.base_release_tag }}" \
            -R "${{ inputs.base_release_repository }}" \
            --pattern "LightTouch-*-android-arm64.apk" --dir ci/base --clobber
          ls -la ci/base
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile

          apk = next(pathlib.Path('ci/base').glob('LightTouch-*-android-arm64.apk'))
          ci = pathlib.Path('ci')
          wanted_keys = (
              'assets/guest-tools/armv6.itpack', 'assets/guest-tools/armv7.itpack',
              'assets/guest-tools/it_seal', 'assets/licenses/firmwarekit/manifest.json',
              'lib/arm64-v8a/libfirmwarekit.so', 'lib/arm64-v8a/liblighttouch_oneshot.so',
              'lib/arm64-v8a/libusbmuxd_qemu.so', 'lib/arm64-v8a/liblt_appservice.so',
          )

          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              missing = [key for key in wanted_keys if key not in names]
              if missing:
                  raise SystemExit(f'{apk.name} does not carry {missing}')

              def copy_tree(prefix, destination):
                  destination = pathlib.Path(destination)
                  for name in names:
                      if not name.startswith(prefix) or name.endswith('/'):
                          continue
                      output = destination / name[len(prefix):]
                      output.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(name) as source, open(output, 'wb') as target:
                          shutil.copyfileobj(source, target)
                      mode = archive.getinfo(name).external_attr >> 16
                      if mode:
                          os.chmod(output, mode & 0o7777)
                  return destination

              copy_tree('assets/guest-tools/', ci / 'guest-tools')
              copy_tree('assets/licenses/firmwarekit/', ci / 'firmwarekit/android/licenses')
              executables = {
                  'lib/arm64-v8a/libfirmwarekit.so': ci / 'firmwarekit/android/firmwarekit',
                  'lib/arm64-v8a/liblighttouch_oneshot.so': ci / 'firmwarekit/android/lighttouch-oneshot',
                  'lib/arm64-v8a/libusbmuxd_qemu.so': ci / 'mobile-services/arm64-v8a/libusbmuxd_qemu.so',
                  'lib/arm64-v8a/liblt_appservice.so': ci / 'mobile-services/arm64-v8a/liblt_appservice.so',
              }
              for name, output in executables.items():
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(archive.read(name))
                  os.chmod(output, 0o755)

          for required in (
              'guest-tools/armv6.itpack', 'guest-tools/armv7.itpack', 'guest-tools/it_seal',
              'firmwarekit/android/firmwarekit', 'firmwarekit/android/lighttouch-oneshot',
              'firmwarekit/android/licenses/manifest.json',
              'mobile-services/arm64-v8a/libusbmuxd_qemu.so',
          ):
              path = ci / required
              if not path.is_file():
                  raise SystemExit(f'missing extracted input: {path}')
          print('extracted firmwarekit, USB bridge and guest tools')
          PY

      - name: Build the APK
        working-directory: Android
        run: |
          ./gradlew --no-daemon --max-workers="$LT_JOBS" \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' \
            --dependency-verification=${{ inputs.dependency_verification }} \
            -PnativeJobs="$LT_JOBS" \
            -PtargetAbis=arm64-v8a \
            -PportableDir="$GITHUB_WORKSPACE/Portable" \
            -PqemuSource="$GITHUB_WORKSPACE/qemu-ios" \
            -PengineRoot="$GITHUB_WORKSPACE/ci/engine" \
            -PfirmwareKitDir="$GITHUB_WORKSPACE/ci/firmwarekit/android" \
            -PguestToolsDir="$GITHUB_WORKSPACE/ci/guest-tools" \
            -PmobileServicesArm64="$GITHUB_WORKSPACE/ci/mobile-services/arm64-v8a" \
            -PsourceRevision="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            -PsourceReference="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}" \
            -Pdebuggable="${{ inputs.debuggable }}" \
            :app:assembleDebug

      # AGP signs a debug build with whatever it finds (or makes) at
      # ~/.android/debug.keystore, which is not the cached key: a run would then
      # hand out an APK that cannot update the one before it. Sign with this
      # workflow's keystore instead, and the check step requires the digest.
      - name: Sign the APK with the workflow's keystore
        working-directory: Android
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" sign --ks "$GITHUB_WORKSPACE/ci/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --in "$APK" --out app-debug-signed.apk
          mv app-debug-signed.apk "$APK"

      - name: Check the APK and write provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENGINE_SHORT="$(git -C qemu-ios rev-parse --short HEAD)"
          APK="ci/LightTouch-${ENGINE_SHORT}${MODE_TAG}-arm64-debug.apk"
          cp Android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          SIGNED="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          [ "$SIGNED" = "$LT_SIGNER_SHA256" ] || {
            echo "::error::the APK carries signer $SIGNED, not this workflow's keystore ($LT_SIGNER_SHA256): a phone could not update its previous install"
            exit 1
          }
          echo "- signer: $SIGNED (the workflow's keystore, so an install updates in place)"
          # check-apk.py targets uncompressed packaging; this APK extracts its
          # libraries so firmwarekit can run out of nativeLibraryDir.
          python3 Android/scripts/check-apk.py "$APK" ||
            echo "::warning::check-apk.py expects uncompressed native libraries; legacy packaging is expected here"
          {
            echo "# LightTouch perf APK"
            echo
            echo "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) by run ${{ github.run_number }} of this workflow."
            echo
            echo "- application revision: $(git rev-parse HEAD) ($GITHUB_REPOSITORY)"
            echo "- engine revision: $(git -C qemu-ios rev-parse HEAD) ($ENGINE_REPO $ENGINE_REF)"
            echo "- engine build: arm64-v8a, NDK $ANDROID_NDK_VERSION, --android-api 29, $LT_JOBS jobs"
            echo "- engine compiler flags: ${LT_ENGINE_CFLAGS:-<none>}"
            if [ -n "$PGO_PROFILE" ]; then
              echo "- PGO profile: $PGO_PROFILE merged as $(cat ci/pgo/merged.sha256)"
            fi
            echo "- reused from ${{ inputs.base_release_repository }} ${{ inputs.base_release_tag }}: firmwarekit, lighttouch-oneshot, USB bridge, guest tools"
            echo "- debuggable: ${{ inputs.debuggable }}; signed with this workflow's own keystore"
            echo
            echo "## Engine commits in $ENGINE_REF that are not in main"
            echo
            gh api "repos/$ENGINE_REPO/compare/main...$(git -C qemu-ios rev-parse HEAD)" \
              --jq '.commits[] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' || echo "- (compare unavailable)"
            echo
            echo "## Engine switches for an A/B on the phone"
            echo
            echo "A debuggable APK reads KEY=VALUE lines from its own files/debug-env, for example:"
            echo
            echo "    adb shell run-as org.lighttouch.android sh -c \"printf 'LT_BQL_SPIN=off\\n' > files/debug-env\""
            echo
            echo "Each run is a full engine start, so measure the same scene twice per setting."
          } > ci/PROVENANCE.txt
          cat ci/PROVENANCE.txt

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: LightTouch-perf-apk-${{ steps.engine.outputs.sha }}${{ inputs.engine_cflags != '' && '-pgo' || '' }}
          path: |
            ci/LightTouch-*-arm64-debug.apk
            ci/PROVENANCE.txt

      - name: Attach the APK to a pre-release
        if: inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ci-$(git -C qemu-ios rev-parse --short HEAD)-r${{ github.run_number }}"
          gh release create "$TAG" ci/LightTouch-*.apk ci/PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "$TAG" --notes-file ci/PROVENANCE.txt
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"