appId: org.lighttouch.android
---
# Requires legitimately imported private base/package. This tests native lifecycle
# state; root acceptance must also inspect guest Home, data durability and new PIDs.
- launchApp:
    clearState: false
- tapOn:
    id: "start_guest"
- extendedWaitUntil:
    visible: "running"
    timeout: 120000
- tapOn: "Pause"
- assertVisible: "paused"
- tapOn: "Resume"
- assertVisible: "running"
- pressKey: HOME
- launchApp:
    stopApp: false
    clearState: false
- assertVisible: "paused"
- tapOn: "Resume"
- assertVisible: "running"
- tapOn:
    id: "screenshot_button"
- extendedWaitUntil:
    visible: "Screenshot saved in Pictures/LightTouch"
    timeout: 10000
- tapOn:
    id: "stop_guest"
- extendedWaitUntil:
    visible: "stopped"
    timeout: 20000
- tapOn:
    id: "start_guest"
- extendedWaitUntil:
    visible: "running"
    timeout: 120000
- tapOn:
    id: "stop_guest"
- extendedWaitUntil:
    visible: "stopped"
    timeout: 20000
